###############################################################################
#                    mpv.conf - libmpv / OpenGL Compatible                    #
#                                                                             #
#  For use with a Qt/QML app embedding mpv via vo=libmpv + OpenGL.            #
#                                                                             #
#  Constraints:                                                               #
#    - vo=libmpv is hardcoded by the app (uses the 'gpu' backend)             #
#    - OpenGL context, NOT Vulkan — gpu-next is NOT available                 #
#    - hwdec=auto is set by the app                                           #
#    - Compute shader variants (_CMP) may fail; use regular .glsl only       #
#                                                                             #
#  DO NOT SET: vo, gpu-api, hwdec, keep-open (app controls these)            #
#                                                                             #
#  SHADERS — Manual via CTRL+number (see input.conf):                        #
#    Auto-profile shader loading is disabled on Windows because               #
#    profile-restore=copy serialises the shader list as a colon-separated    #
#    string. Windows absolute paths already contain ':' (e.g. C:\…), so     #
#    the second and later ~~ entries are never expanded and mpv tries to      #
#    open a path like "C:\…\shader1.glsl:~~/shaders/shader2.glsl" as a      #
#    single filename → INVALID_ARGUMENT / OpenGL INVALID_OPERATION.          #
#    Use CTRL+1–4 from input.conf to load shader combos at runtime.          #
#                                                                             #
#  Required shaders (all OpenGL safe, non-CMP variants):                     #
#    ArtCNN:     https://github.com/Artoriuz/ArtCNN/tree/main/GLSL           #
#                Download the regular .glsl, NOT _CMP variants                #
#    FSRCNNX:    https://github.com/igv/FSRCNN-TensorFlow/releases           #
#    KrigBil:    https://gist.github.com/igv/a015fc885d5c22e6891820ad89555637#
#    SSimDS/SR:  https://gist.github.com/igv                                 #
#    ravu:       https://github.com/bjin/mpv-prescalers (gather/ folder)     #
#    Anime4K:    https://github.com/bloc97/Anime4K/releases                  #
###############################################################################


###############################################################################
#                              PROFILE                                        #
###############################################################################

# gpu-hq is the legacy profile compatible with the old 'gpu' backend used by
# libmpv.  Sets: scale=spline36, cscale=spline36, dscale=mitchell,
# correct-downscaling=yes, linear-downscaling=yes, sigmoid-upscaling=yes,
# deband=yes
profile=gpu-hq


###############################################################################
#                              GENERAL                                        #
###############################################################################

osd-bar=no
osd-font-size=32
save-position-on-quit=no

# NOTE: video-sync=display-resample was tried for judder-free playback but it
# leaves no timing headroom for heavy shader chains (Anime4K A+A) and causes
# stutter. The default 'audio' sync drops frames gracefully and keeps A+A smooth.


###############################################################################
#                              AUDIO                                          #
###############################################################################

volume=100
volume-max=200
alang=jpn,ja,eng,en
audio-file-auto=fuzzy


###############################################################################
#                            SUBTITLES                                        #
###############################################################################

slang=eng,en
sub-auto=fuzzy
sub-font-size=40
sub-border-size=1.5
demuxer-mkv-subtitle-preroll=yes


###############################################################################
#                            SCREENSHOTS                                      #
###############################################################################

screenshot-format=png
screenshot-png-compression=4
screenshot-high-bit-depth=yes
screenshot-directory="~~/screenshots"
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"

###############################################################################
#                          DITHERING                                          #
###############################################################################

# 'fruit' is the safest for the gpu backend + 8-bit displays.
# 'error-diffusion' requires gpu-next — do NOT use here.
dither-depth=auto
dither=fruit


###############################################################################
#                          DEBANDING                                          #
###############################################################################

deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4


###############################################################################
#                     SCALERS (Global Defaults)                               #
###############################################################################

# Luma upscale fallback
scale=ewa_lanczossharp

# Luma downscale
dscale=mitchell

# Chroma upscale
cscale=spline36

correct-downscaling=yes

# Off globally — SSimDownscaler (CTRL+5) needs gamma-space input.
# Profiles below re-enable it where appropriate.
linear-downscaling=no

sigmoid-upscaling=yes


###############################################################################
#                         ANTI-RINGING                                        #
###############################################################################

scale-antiring=0.5
dscale-antiring=0.5
cscale-antiring=0.5


###############################################################################
#                                                                             #
#                     CONDITIONAL AUTO-PROFILES                               #
#                                                                             #
#  These profiles adjust SCALERS and DEBAND only.                             #
#  No glsl-shader lines here — see shader note in the header above.          #
#  Load shaders at runtime with CTRL+1–4 from input.conf.                    #
#                                                                             #
###############################################################################


#=============================================================================
# 4K Downscaling (source >= 2160p)
# Tunes the downscaler; SSimDownscaler can be loaded via CTRL+5.
#=============================================================================
[4k-downscale]
profile-desc=4K downscaling tuning
profile-cond=width >= 3840 or height >= 2160
profile-restore=copy

dscale=mitchell
dscale-antiring=0.6
linear-downscaling=no

# 4K is already high-res — heavy debanding here is the main render-side cause of
# lag/stutter on 4K sources (decode itself is cheap on a modern GPU). Lighten it.
# Tip: don't run upscaler shaders (ArtCNN/Anime4K) on 4K content — clear with CTRL+0.
deband-iterations=1
deband-grain=0


#=============================================================================
# HD Upscaling (1080p content displayed larger)
# Good fallback scalers; swap to Anime4K A+A via CTRL+1 or Mode A via CTRL+2.
#=============================================================================
[hd-upscale]
profile-desc=HD upscaling tuning
profile-cond=width >= 1280 and width < 3840 and height >= 720 and height < 2160
profile-restore=copy

scale=ewa_lanczos
scale-blur=0.981251
cscale=spline36


#=============================================================================
# SD / Low Quality Upscale (sub-720p)
# Aggressive debanding for compressed sources; load FSRCNNX via CTRL+3.
#=============================================================================
[sd-upscale]
profile-desc=SD upscaling tuning + heavy deband
profile-cond=width < 1280 and height < 720
profile-restore=copy

deband-iterations=4
deband-threshold=48
deband-range=24
deband-grain=5
