# The app hardcodes vo=libmpv (legacy 'gpu' backend, OpenGL not Vulkan) and hwdec.
# Do not set vo, gpu-api, hwdec or keep-open here. gpu-next is unavailable.
# No glsl-shader lines in profiles: profile-restore=copy joins the list with ':',
# which collides with Windows drive letters. Load shaders via input.conf instead.

profile=gpu-hq

osd-bar=no
osd-font-size=32
save-position-on-quit=no

# video-sync=display-resample leaves no timing headroom for heavy shader chains.
volume=100
volume-max=200
alang=jpn,ja,eng,en
audio-file-auto=fuzzy

slang=eng,en
sub-auto=fuzzy
sub-font-size=40
sub-border-size=1.5
demuxer-mkv-subtitle-preroll=yes

screenshot-format=png
screenshot-png-compression=4
screenshot-high-bit-depth=yes
screenshot-directory="~~/screenshots"
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"

# error-diffusion requires gpu-next.
dither-depth=auto
dither=fruit

deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4

scale=ewa_lanczossharp
dscale=mitchell
cscale=spline36
correct-downscaling=yes

# Off globally because SSimDownscaler needs gamma-space input.
linear-downscaling=no
sigmoid-upscaling=yes

scale-antiring=0.5
dscale-antiring=0.5
cscale-antiring=0.5

[4k-downscale]
profile-desc=4K downscaling tuning
profile-cond=width >= 3840 or height >= 2160
profile-restore=copy
dscale=mitchell
dscale-antiring=0.6
linear-downscaling=no
deband-iterations=2
deband-grain=2

[hd-upscale]
profile-desc=HD upscaling tuning
profile-cond=width >= 1280 and width < 3840 and height >= 720 and height < 2160
profile-restore=copy
scale=ewa_lanczos
scale-blur=0.981251
cscale=spline36

[sd-upscale]
profile-desc=SD upscaling tuning
profile-cond=width < 1280 and height < 720
profile-restore=copy
deband-iterations=4
deband-grain=5
