# Shader toggles. ';' separates the list (Windows).
# The chains match Mangayomi's built-in ones exactly.
#
# Traps, all measured with mpv's vo-passes timings:
#   - //!COMPUTE shaders render corrupted on the legacy 'gpu' backend, which is what
#     vo=libmpv gives us. That is ArtCNN (Luma Upscaling) and NVScaler, kept here for
#     parity but expect artefacts until we are on gpu-next.
#   - OleVod streams are 0.6-0.8 Mbps, so sharpening only finds the burned-in subtitles.

CTRL+1  no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode A+A"

CTRL+2  no-osd change-list glsl-shaders set "~~/shaders/FSR.glsl"; show-text "AMD FSR"

CTRL+3  no-osd change-list glsl-shaders set "~~/shaders/SGSR.glsl"; show-text "Q Snapdragon GSR"

CTRL+4  no-osd change-list glsl-shaders set "~~/shaders/NVScaler.glsl"; show-text "NVIDIA Image Scaling"

CTRL+5  no-osd change-list glsl-shaders set "~~/shaders/ArtCNN_C4F16.glsl;~~/shaders/CfL_Prediction.glsl"; show-text "Luma Upscaling"

CTRL+0  no-osd change-list glsl-shaders clr ""; set scale ewa_lanczossharp; set deband-iterations 4; set deband-threshold 35; set deband-range 16; set deband-grain 4; show-text "Shaders cleared"

b       cycle deband; show-text "Debanding: ${deband}"

CTRL+b  set deband yes; set deband-iterations 4; set deband-threshold 80; set deband-range 24; set deband-grain 12; show-text "Deband: max"
