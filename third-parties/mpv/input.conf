###############################################################################
#  input.conf - Shader toggles (Windows, vo=gpu / OpenGL safe)                #
#  Uses ; as shader list separator (Windows standard)                         #
#                                                                             #
#  NOTE: ArtCNN / other libplacebo-era shaders render CORRUPTED colour on     #
#  this renderer (legacy OpenGL 'gpu', not gpu-next/Vulkan) — do not use them #
#  here. Anime4K's non-CMP .glsl shaders are the correct choice for this VO.  #
#  If A+A still lags on heavy content: press CTRL+2 (Mode A) or 'b' (drop     #
#  debanding for more GPU headroom).                                          #
###############################################################################

# CTRL+1 — Anime4K Mode A+A (Fast): double restore + upscale with the lighter
#          M/S CNNs. Best quality-per-GPU-cost on this renderer.
CTRL+1  no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl;~~/shaders/Anime4K_Restore_CNN_S.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode A+A (Fast)"

# CTRL+2 — Anime4K Mode A (single restore + 2x upscale) — lightest.
CTRL+2  no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A"

# CTRL+3 — FSRCNNX luma upscale (alternative).
CTRL+3  no-osd change-list glsl-shaders set "~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"; show-text "FSRCNNX"

# CTRL+4 — SSimDownscaler (only useful when displaying 4K on a smaller window).
CTRL+4  no-osd change-list glsl-shaders set "~~/shaders/SSimDownscaler.glsl"; show-text "SSimDownscaler"

# CTRL+0 — clear all shaders.
CTRL+0  no-osd change-list glsl-shaders clr ""; show-text "Shaders cleared"

# b — toggle debanding (turning it off frees noticeable GPU time for shaders).
b       cycle deband; show-text "Debanding: ${deband}"
